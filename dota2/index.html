<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Отправь · Кликер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #191014;
    --bg-2: #241620;
    --panel: #2a1a22;
    --line: rgba(245, 233, 227, 0.10);
    --ink: #F5E9E3;
    --ink-dim: #C7B4B6;
    --red: #E8393B;
    --red-soft: #C97B7E;
    --red-glow: rgba(232, 57, 59, 0.35);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(circle at 50% -10%, #331924 0%, var(--bg) 55%),
      var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
  }
  ::selection{ background: var(--red); color: white; }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 20px 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .brand{
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    margin-bottom: 6px;
  }
  .brand span{ color: var(--red); }

  h1{
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: clamp(30px, 6vw, 44px);
    line-height: 1.08;
    margin: 4px 0 10px;
  }

  .sub{
    color: var(--ink-dim);
    font-size: 15px;
    max-width: 40ch;
    margin: 0 0 34px;
  }

  .score-row{
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 4px;
  }
  .score{
    font-family: 'Sora', sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 12vw, 76px);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .score-unit{
    font-size: 16px;
    color: var(--red-soft);
    font-weight: 600;
    padding-bottom: 10px;
  }
  .rate{
    color: var(--ink-dim);
    font-size: 14px;
    margin-bottom: 36px;
    min-height: 18px;
  }
  .rate b{ color: var(--red-soft); font-weight: 600; }

  .plane-zone{
    position: relative;
    width: 220px;
    height: 220px;
    margin-bottom: 12px;
  }

  .plane-btn{
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: none;
    padding: 0;
    cursor: pointer;
    background: transparent;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .plane-btn::before{
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--red-glow) 0%, transparent 70%);
    opacity: 0.9;
    animation: pulse 2.6s ease-in-out infinite;
  }
  .plane-btn img{
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 50%;
    box-shadow:
      0 0 0 1px rgba(245,233,227,0.08),
      0 20px 50px -10px rgba(0,0,0,0.6),
      0 0 60px -8px var(--red-glow);
    transition: transform 0.08s ease;
    position: relative;
  }
  .plane-btn:active img{
    transform: scale(0.93);
  }
  @keyframes pulse{
    0%, 100%{ transform: scale(1); opacity: 0.7; }
    50%{ transform: scale(1.08); opacity: 1; }
  }

  .float-pop{
    position: absolute;
    left: 50%;
    top: 10%;
    transform: translateX(-50%);
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--red-soft);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    white-space: nowrap;
  }
  @keyframes floatUp{
    0%{ opacity: 0; transform: translate(-50%, 0) scale(0.8); }
    15%{ opacity: 1; transform: translate(-50%, -10px) scale(1); }
    100%{ opacity: 0; transform: translate(-50%, -90px) scale(1); }
  }

  .hint{
    color: var(--ink-dim);
    font-size: 13px;
    margin-top: 18px;
    margin-bottom: 46px;
  }

  .section-head{
    width: 100%;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 10px;
    margin-bottom: 4px;
    text-align: left;
  }
  .section-head h2{
    font-family: 'Sora', sans-serif;
    font-size: 18px;
    font-weight: 700;
    margin: 0;
  }
  .section-head span{
    font-size: 13px;
    color: var(--ink-dim);
  }

  .upgrades{
    width: 100%;
    display: flex;
    flex-direction: column;
  }

  .upgrade{
    display: flex;
    align-items: center;
    gap: 16px;
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid var(--line);
    padding: 16px 4px;
    text-align: left;
    cursor: pointer;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  .upgrade:hover:not(:disabled){
    background: rgba(245,233,227,0.03);
  }
  .upgrade:disabled{
    cursor: not-allowed;
    opacity: 0.4;
  }
  .u-icon{
    font-size: 22px;
    width: 34px;
    text-align: center;
    flex-shrink: 0;
  }
  .u-main{
    flex: 1;
    min-width: 0;
  }
  .u-name{
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 2px;
  }
  .u-desc{
    font-size: 12.5px;
    color: var(--ink-dim);
  }
  .u-right{
    text-align: right;
    flex-shrink: 0;
  }
  .u-cost{
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--red-soft);
  }
  .u-owned{
    font-size: 11.5px;
    color: var(--ink-dim);
    margin-top: 2px;
  }

  .reset{
    margin-top: 40px;
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 12.5px;
    padding: 8px 14px;
    border-radius: 100px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }
  .reset:hover{
    border-color: var(--red-soft);
    color: var(--red-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .plane-btn::before{ animation: none; }
    .float-pop{ animation: none; opacity: 0; }
  }
</style>
</head>

    <h2>Ускорители</h2>
    <span id="perClickInfo">+1 за клик</span>
  </div>

<script>
(function(){
  const STORAGE_KEY = "red_clicker_save_v1";

  const upgradeDefs = [
    {
      id: "finger",
      icon: "👆",
      name: "Быстрые пальцы",
      desc: "Каждый клик отправляет на 1 сигнал больше",
      baseCost: 15,
      growth: 1.15,
      effect: "click",
      value: 1
    },
    {
      id: "relay",
      icon: "📡",
      name: "Ретранслятор",
      desc: "Отправляет 1 сигнал в секунду сам",
      baseCost: 40,
      growth: 1.16,
      effect: "auto",
      value: 1
    },
    {
      id: "operator",
      icon: "🧑‍💻",
      name: "Оператор связи",
      desc: "Отправляет 5 сигналов в секунду сам",
      baseCost: 260,
      growth: 1.17,
      effect: "auto",
      value: 5
    },
    {
      id: "tower",
      icon: "🗼",
      name: "Вышка",
      desc: "Отправляет 25 сигналов в секунду сама",
      baseCost: 1800,
      growth: 1.18,
      effect: "auto",
      value: 25
    },
    {
      id: "satellite",
      icon: "🛰️",
      name: "Спутник",
      desc: "Отправляет 120 сигналов в секунду сам",
      baseCost: 12000,
      growth: 1.19,
      effect: "auto",
      value: 120
    },
    {
      id: "amplifier",
      icon: "⚡",
      name: "Усилитель клика",
      desc: "Каждый клик отправляет ещё на 10 сигналов больше",
      baseCost: 5000,
      growth: 1.2,
      effect: "click",
      value: 10
    }
  ];

  let state = {
    score: 0,
    perClick: 1,
    perSecond: 0,
    owned: {}
  };

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        state.score = parsed.score || 0;
        state.owned = parsed.owned || {};
      }
    }catch(e){}
    recompute();
  }

  function save(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ score: state.score, owned: state.owned }));
    }catch(e){}
  }

  function recompute(){
    let click = 1;
    let auto = 0;
    upgradeDefs.forEach(function(u){
      const n = state.owned[u.id] || 0;
      if(u.effect === "click") click += u.value * n;
      if(u.effect === "auto") auto += u.value * n;
    });
    state.perClick = click;
    state.perSecond = auto;
  }

  function costFor(u){
    const n = state.owned[u.id] || 0;
    return Math.ceil(u.baseCost * Math.pow(u.growth, n));
  }

  function fmt(n){
    n = Math.floor(n);
    if(n < 1000) return String(n);
    if(n < 1000000) return (n/1000).toFixed(n % 1000 === 0 ? 0 : 1).replace(/\.0$/,'') + "K";
    if(n < 1000000000) return (n/1000000).toFixed(2).replace(/0+$/,'').replace(/\.$/,'') + "M";
    return (n/1000000000).toFixed(2).replace(/0+$/,'').replace(/\.$/,'') + "B";
  }

  const scoreEl = document.getElementById("score");
  const rateEl = document.getElementById("rate");
  const perClickInfo = document.getElementById("perClickInfo");
  const upgradesEl = document.getElementById("upgrades");
  const planeBtn = document.getElementById("planeBtn");
  const planeZone = document.querySelector(".plane-zone");

  function render(){
    scoreEl.textContent = fmt(state.score);
    perClickInfo.textContent = "+" + fmt(state.perClick) + " за клик";
    rateEl.innerHTML = state.perSecond > 0
      ? "Сеть отправляет <b>" + fmt(state.perSecond) + "</b> сигн./сек сама"
      : "Пока всё тихо — нажми, чтобы начать";

    upgradesEl.innerHTML = "";
    upgradeDefs.forEach(function(u){
      const cost = costFor(u);
      const owned = state.owned[u.id] || 0;
      const affordable = state.score >= cost;

      const btn = document.createElement("button");
      btn.className = "upgrade";
      btn.disabled = !affordable;
      btn.innerHTML =
        '<div class="u-icon">' + u.icon + '</div>' +
        '<div class="u-main">' +
          '<div class="u-name">' + u.name + '</div>' +
          '<div class="u-desc">' + u.desc + '</div>' +
        '</div>' +
        '<div class="u-right">' +
          '<div class="u-cost">' + fmt(cost) + '</div>' +
          '<div class="u-owned">куплено: ' + owned + '</div>' +
        '</div>';
      btn.addEventListener("click", function(){ buy(u); });
      upgradesEl.appendChild(btn);
    });
  }

  function buy(u){
    const cost = costFor(u);
    if(state.score < cost) return;
    state.score -= cost;
    state.owned[u.id] = (state.owned[u.id] || 0) + 1;
    recompute();
    render();
    save();
  }

  function spawnFloat(text){
    const el = document.createElement("div");
    el.className = "float-pop";
    el.textContent = text;
    el.style.left = (45 + Math.random() * 10) + "%";
    planeZone.appendChild(el);
    setTimeout(function(){ el.remove(); }, 900);
  }

  planeBtn.addEventListener("click", function(){
    state.score += state.perClick;
    spawnFloat("+" + fmt(state.perClick));
    scoreEl.textContent = fmt(state.score);
    render();
    save();
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    if(confirm("Точно сбросить весь прогресс?")){
      state = { score: 0, perClick: 1, perSecond: 0, owned: {} };
      recompute();
      render();
      save();
    }
  });

  setInterval(function(){
    if(state.perSecond > 0){
      state.score += state.perSecond / 10;
      render();
    }
  }, 100);

  setInterval(save, 4000);

  load();
  render();
})();
</script>

</body>
</html>
